name: stac2cube
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip

  # Windows-only runtime
  # - vs2015_runtime  # [win]

  # --- core compiled geo stack ---
  - gdal
  - proj
  - geos
  - pyproj
  - rasterio
  - fiona
  - geopandas
  - rioxarray
  - shapely
  - affine

  # JP2 driver plugin for Sentinel-2 .jp2 (needed on Linux)
  - libgdal-jp2openjpeg  # [linux]

  # --- AROSICS ---
  - arosics
  - geoarray

  # --- core scientific stack ---
  - numpy<2
  - scipy
  - pandas
  - xarray
  - dask
  - tqdm

  # --- STAC / EO stack ---
  - odc-stac
  - pystac-client
  - planetary-computer
  - s2cloudless

  # --- IO formats ---
  - netcdf4
  - h5netcdf

  # --- viz / notebooks ---
  - matplotlib
  - pillow
  - branca
  - ipython
  - ipywidgets
  - jupyterlab
  - ipykernel
  # zoom/pan renderer of the interactive time viewer; anywidget is what lets
  # plotly's FigureWidget render in JupyterLab.
  - plotly
  - anywidget

  # --- other tools ---
  - opencv
  - whitebox
  - pyaml
  - leafmap

  # --- pip installs (CPU torch by default; works everywhere) ---
  - pip:
      - torch==2.2.2
      - torchvision==0.17.2
      - sen2sr
      - mlstac
      - -e .
